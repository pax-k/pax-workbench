[package]
name = "pax-workbench"
version = "0.1.0"
description = "A repo-native Build Right engineering workbench"
authors = ["Pax"]
edition = "2021"

[lib]
name = "pax_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fs2 = "0.4"
libc = "0.2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
